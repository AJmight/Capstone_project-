# Render Blueprint: one Streamlit web service.
services:
  - type: web
    name: sme-procurement-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "15"
      - key: LLM_MAX_ROUNDS
        value: 1
      - key: LLM_MAX_MODEL_ATTEMPTS
        value: "7"
      - key: AGENT_MAX_TURNS
        value: "3"
      - key: AGENT_MAX_TOOL_CALLS
        value: "6"
      - key: RESTOCK_AGENT_MAX_TURNS
        value: "5"
      - key: RESTOCK_AGENT_MAX_TOOL_CALLS
        value: "8"
