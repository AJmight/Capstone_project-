# Render Blueprint: one Streamlit web service.
services:
  - type: web
    name: sme-procurement-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false          # you enter the value in the Render dashboard
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        sync: false
