# Streamlit theme tokens for the Stitch ledger screens in src/streamlit_app.py.
# Keep native buttons, focus rings and form controls in the same teal/warm palette.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FCF9F8"
secondaryBackgroundColor = "#F6F3F2"
textColor = "#1C1B1B"
font = "sans serif"

[browser]
gatherUsageStats = false              # do not send usage statistics to Streamlit
